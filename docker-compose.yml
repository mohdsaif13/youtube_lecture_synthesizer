services:
  lecture-synthesizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube_lecture_synthesizer
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    volumes:
      - ./data:/app/data
